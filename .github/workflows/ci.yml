name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests create and migrate this database themselves (npm test -> pretest).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deadletter_test
      # The UI tests drive the Chrome that ships on the runner.
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test

      - name: Evaluation is reproducible
        run: |
          npm run eval > /dev/null
          cp reports/eval-report.json /tmp/first.json
          npm run eval > /dev/null
          diff /tmp/first.json reports/eval-report.json
